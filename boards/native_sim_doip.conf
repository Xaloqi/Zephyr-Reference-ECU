# =============================================================================
# Xaloqi Zephyr-Reference-ECU
# boards/native_sim_doip.conf
#
# native_sim loopback-only config for the DoIP build, adapted from Xaloqi
# EDS's own examples/basic_ecu_doip/boards/native_sim/native_sim_doip.conf.
#
# Reachable only from inside the native_sim process itself, not from the
# host OS by any method (CONFIG_NET_LOOPBACK blocks NET_L2_ETHERNET's
# default — a known, disclosed Zephyr/native_sim limitation, EDS#257, not
# something this repo can fix). This file exists for a quick local sanity
# build only, needing no host network setup. For real DoIP bring-up, use
# boards/nucleo_h753zi_doip.conf on real hardware — see README.md "Phase 4".
#
# BUILDING:
#   west build -b native_sim . -- \
#       -DDIAG_SKIP_CODEGEN=ON \
#       -DDIAG_DOIP_ONLY_BUILD=ON \
#       -DEXTRA_CONF_FILE=boards/native_sim_doip.conf
# =============================================================================

CONFIG_POSIX_API=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_NATIVE=y

# --- Networking base (prj.conf has none — the CAN build needs none) -------
# NET_SOCKETS_POSIX_NAMES intentionally omitted: conflicts with POSIX_API=y.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_MAX_CONN=8
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_POSIX_MAX_FDS=16

CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_NATIVE_POSIX=y

CONFIG_STACK_CANARIES=n
CONFIG_NEWLIB_LIBC=y

CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_POSIX=y

CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_WATCHDOG=n
