# =============================================================================
# Xaloqi Zephyr-Reference-ECU
# boards/native_sim.conf
#
# native_sim-specific Kconfig overrides, auto-merged by Zephyr CMake on top
# of prj.conf for this board only (Zephyr convention: <app>/boards/<BOARD>.conf
# is picked up automatically). See Xaloqi EDS's own
# boards/native_sim/native_sim.conf for the full rationale behind each
# override below — Zephyr 3.7 promotes several Kconfig dependency warnings
# to fatal errors on native_sim.
# =============================================================================

CONFIG_CAN_LOOPBACK=y
CONFIG_POSIX_API=y
CONFIG_STACK_CANARIES=n
CONFIG_CAN_STATS=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_NEWLIB_LIBC=y
CONFIG_REBOOT=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_WATCHDOG=n
