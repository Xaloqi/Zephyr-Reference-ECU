# =============================================================================
# Xaloqi Zephyr-Reference-ECU
# boards/nucleo_h753zi_doip.conf
#
# Real-hardware DoIP config for the NUCLEO-H753ZI, adapted from Xaloqi EDS's
# own confirmed examples/basic_ecu_doip/boards/nucleo_h753zi/
# nucleo_h753zi_doip.conf — not re-derived.
#
# NUCLEO-H753ZI's Zephyr board support already wires the STM32 Ethernet MAC
# and PHY in devicetree with status "okay" (RMII pinctrl, MDIO) — no board
# overlay needed, only this application-level net stack config.
#
# HOST-SIDE SETUP THIS CONF EXPECTS: a direct Ethernet cable from this board
# to the host machine's own NIC, with the host given a static IP on the same
# /24, e.g.:
#   sudo ip addr add 10.10.10.2/24 dev <host-iface>
# No router, no DHCP server — a direct point-to-point bench link.
#
# JUMPERS: JP6 and JP7 must be ON for Ethernet — see README.md "Phase 4"
# and the bill of materials (PA2/PB13 otherwise conflict with the ST
# Zio/morpho connectors, per Zephyr's own board DTS warning).
#
# BUILDING:
#   west build -b nucleo_h753zi . -- \
#       -DDIAG_SKIP_CODEGEN=ON \
#       -DDIAG_DOIP_ONLY_BUILD=ON \
#       -DEXTRA_CONF_FILE=boards/nucleo_h753zi_doip.conf
# =============================================================================

# --- Networking base (prj.conf has none — the CAN build needs none) -------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_MAX_CONN=8
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_POSIX_MAX_FDS=16

# --- Real Ethernet driver (auto-selected once NET_L2_ETHERNET is on) -------
CONFIG_NET_L2_ETHERNET=y

# --- Static IPv4 — point-to-point bench link, no DHCP server present -------
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.10.10.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.10.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# --- Real hardware: keep console/log on the ST-LINK VCP (board default via
#     zephyr,console = &usart3) ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
