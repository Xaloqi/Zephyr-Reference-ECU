# =============================================================================
# Xaloqi Zephyr-Reference-ECU
# boards/xenvm_can_fd.conf
#
# Added by -DDIAG_CAN_FD=ON (CMakeLists.txt) on the xenvm board, on top of
# boards/xenvm_can.conf: CAN FD over Xaloqi/zephyr-virtio-can. The driver offers
# CAN_MODE_FD when the device side negotiates VIRTIO_CAN_F_CAN_FD. There is no
# data-phase timing here: VIRTIO 1.4 has no guest-side bit timing, and BRS is
# not expressible in it, so the bus rates are DomD's (ip link ... dbitrate).
# xenvm/run.sh can builds this with XENVM_CAN_FD=1.
# =============================================================================
CONFIG_CAN_FD_MODE=y
