# =============================================================================
# Xaloqi Zephyr-Reference-ECU
# boards/nucleo_h753zi_secureboot.conf
#
# Additive on top of the auto-picked-up boards/nucleo_h753zi.conf (Zephyr
# merges both — this file only needs the MCUboot-specific delta). Adapted
# from Xaloqi EDS's own confirmed examples/safeboot_ecu/boards/nucleo_h753zi/
# nucleo_h753zi.conf.
#
# Full dependency chain (confirmed against the actual subsys/dfu/Kconfig
# source, v3.7.0):
#   menuconfig IMG_MANAGER          depends on STREAM_FLASH
#     choice "Image manager"        default MCUBOOT_IMG_MANAGER
#       MCUBOOT_IMG_MANAGER         depends on FLASH_MAP (already set)
#                                   select MCUBOOT_BOOTUTIL_LIB (provides
#                                   boot_is_img_confirmed()/
#                                   boot_write_img_confirmed())
# CONFIG_STREAM_FLASH is the actual load-bearing one: without it the whole
# IMG_MANAGER menu is invisible, so nothing inside it takes effect no
# matter what else is set here.
# =============================================================================

CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# --- MCUboot secondary slot write support -----------------------------------
# flash_area_write() requires this to allow writes to non-erase-aligned
# offsets. STM32H753 flash requires 256-bit (32-byte) aligned writes.
CONFIG_FLASH_PAGE_LAYOUT=y
