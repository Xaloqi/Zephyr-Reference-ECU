# SPIKE (virtio-can frontend, not merged): xenvm_doip.conf without networking.
# virtio-can comes from the out-of-tree can_virtio module (ZEPHYR_EXTRA_MODULES).
# Xaloqi Zephyr-Reference-ECU
# boards/xenvm_doip.conf
#
# DoIP build for Zephyr's `xenvm` board: ReferenceBCM as a Xen guest (SoDeV's
# DomZ), reached over virtio-net. Zephyr v4.4.1 + SDK 1.0.1 only, through
# xenvm/west.yml; the NUCLEO builds stay on v3.7.0. xenvm/run.sh builds and
# boots it. Read xenvm/README.md "Honest gaps" before claiming more than this.
#
# BUILDING (inside the xenvm workspace):
#   west build -b xenvm -s <this repo> -- -DDIAG_SKIP_CODEGEN=ON \
#       -DDIAG_DOIP_ONLY_BUILD=ON -DDIAG_ENTROPY_SEEDS=ON \
#       -DEXTRA_CONF_FILE=boards/xenvm_doip.conf \
#       -DEXTRA_DTC_OVERLAY_FILE=boards/xenvm_doip.overlay
# =============================================================================

# --- C library -------------------------------------------------------------
# SDK 1.0.1 ships no newlib, so prj.conf's NEWLIB_LIBC=y would silently become
# picolibc. EDS#499's guard turns that into a build error; this variant accepts
# picolibc, explicitly.
CONFIG_NEWLIB_LIBC=n
CONFIG_PICOLIBC=y
CONFIG_EDS_REQUIRE_NEWLIB=n

# --- Stack canaries: OFF, stated ---------------------------------------------
# The only entropy source a xenvm guest has is virtio-rng. It is a POST_KERNEL
# driver with no ISR API, so Zephyr's early canary seed (z_early_rand_get(),
# before POST_KERNEL) falls back to an LCG over the cycle counter. Canaries
# here would look enabled and not be seeded by entropy. EDS#500's guard refuses
# that combination; this variant opts out instead of pretending.
# NOTE: on Zephyr 4.4 STACK_CANARIES is a choice member, and this =n does NOT
# undo prj.conf's =y. xenvm/scripts/build.sh therefore drops that prj.conf line
# for this build and asserts the final .config.
CONFIG_STACK_CANARIES=n
CONFIG_EDS_REQUIRE_STACK_CANARIES=n

# --- Watchdog: none (EDS's documented degraded mode) -------------------------
# Zephyr v4.4.1 has no Xen watchdog driver (drivers/watchdog/wdt_xen.c is in
# Zephyr main only). EDS logs "running without HW supervision" at boot.
CONFIG_WATCHDOG=n

# --- Entropy for SecurityAccess seeds: virtio-rng ----------------------------
# zephyr,entropy = virtio-rng (boards/xenvm_doip.overlay). src/main_doip.c
# registers a TRNG callback over it (DIAG_ENTROPY_SEEDS). Without that, every
# boot hands out the same seed sequence (EDS's LFSR fallback).
CONFIG_ENTROPY_GENERATOR=y

# --- NVM: RAM-backed simulated flash (xenvm has no flash device) --------------
# DTCs and the door-cycle count persist across a warm ECUReset, not a DomZ
# re-create.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_NVS=y

# --- Networking (same stack as boards/nucleo_h753zi_doip.conf) ---------------
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_BUILD_OUTPUT_HEX=n
CONFIG_VIRTIO=y
# EDS calls sys_reboot() on the CAN path too; its configdefault covers socket builds only (EDS#511).
CONFIG_REBOOT=y
