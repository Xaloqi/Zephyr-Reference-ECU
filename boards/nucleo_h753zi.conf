# =============================================================================
# Xaloqi Zephyr-Reference-ECU
# boards/nucleo_h753zi.conf
#
# Board-specific Kconfig overrides for the NUCLEO-H753ZI, merged on top of
# prj.conf. Copied from Xaloqi EDS's own confirmed boards/nucleo_h753zi/
# nucleo_h753zi.conf (Zephyr 3.7 / STM32H7 Cortex-M7 specifics — hidden
# Kconfig symbols, MPU vs software-canary conflict, DT-gated CAN/IWDG
# driver selection) — see that file for the full per-symbol rationale.
# =============================================================================

# --- UART3 for ST-LINK virtual COM port logging ------------------------------
CONFIG_SERIAL=y
CONFIG_UART_STM32=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# --- Hardware watchdog (IWDG, DT-gated — do not set CONFIG_WDT_STM32_IWDG) ---
CONFIG_WATCHDOG=y
# Deliberate, not a default: Zephyr's IWDG driver arms the watchdog before
# main() (CONFIG_IWDG_STM32_INITIAL_TIMEOUT, 100 ms), so supervision starts at
# driver init rather than when main() gets round to it -- the earliest any
# option here offers. The cost is a hard budget: everything before
# src/main.c's diag_wdt_init() must finish inside those 100 ms. Measured on
# the bench (CAN build): main() reached at <1 ms uptime -- ~99 ms of margin.
# src/main.c warns at boot if that drops below half the window.
# The DoIP variant cannot meet this budget (its pre-main waits for the network)
# and overrides it -- see boards/nucleo_h753zi_doip.conf.
CONFIG_WDT_DISABLE_AT_BOOT=n

# --- ARM MPU (Cortex-M7, 16-region) ------------------------------------------
CONFIG_ARM_MPU=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- MPU_STACK_GUARD (auto-selected by ARM_MPU) conflicts with these two -----
CONFIG_STACK_SENTINEL=n
CONFIG_STACK_CANARIES=n

# --- Hardware RNG — required for the AES-CMAC SecurityAccess challenge ------
CONFIG_ENTROPY_GENERATOR=y

# --- Flash + NVS (required by platform/nvm_store.c) --------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
