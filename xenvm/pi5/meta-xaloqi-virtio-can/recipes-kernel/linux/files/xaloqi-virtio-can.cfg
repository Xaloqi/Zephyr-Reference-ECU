# DomD kernel options for the Pi 5 CAN bench (the same Image boots Dom0 in the
# linux flavour; none of this matters there). bcm2712_defconfig builds the CAN
# and DesignWare SPI drivers as modules; built in here, so the HAT appears
# without module packaging or load ordering.

# The HAT: two MCP2515 on RP1 SPI0 (snps,dw-apb-ssi).
CONFIG_SPI=y
CONFIG_SPI_DESIGNWARE=y
CONFIG_SPI_DW_MMIO=y
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_DEV=y
CONFIG_CAN_NETLINK=y
CONFIG_CAN_CALC_BITTIMING=y
CONFIG_CAN_MCP251X=y

# The tester (UDS over ISO-TP sockets) and the canary bus.
CONFIG_CAN_ISOTP=y
CONFIG_CAN_VCAN=y

# xen-vhost-frontend: privcmd for ioreqs and foreign mapping, and privcmd's
# irqfd to inject DomZ's virtio-mmio interrupts. PRIVCMD_EVENTFD depends on
# XEN_VIRTIO. The same options as xenvm/scripts/linux.config.
CONFIG_XEN_PRIVCMD=y
CONFIG_XEN_VIRTIO=y
CONFIG_XEN_PRIVCMD_EVENTFD=y
