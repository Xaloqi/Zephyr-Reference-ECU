#
# meta-xaloqi-virtio-can: SoDeV CAN architecture (A) on the Raspberry Pi 5.
# DomD owns the CAN HAT (XAQ_CAN_HAT below) as SocketCAN can0/can1 and
# serves DomZ's virtio-can and virtio-rng with rust-vmm
# vhost-device behind Linaro's xen-vhost-frontend. Added to the DomD build of
# sodev-demo-workspace-rpi by ../sodev-add.sh; see ../README.md.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xaloqi-virtio-can"
BBFILE_PATTERN_xaloqi-virtio-can = "^${LAYERDIR}/"
# Above the SoDeV layers (8), so its bbappends apply after theirs.
BBFILE_PRIORITY_xaloqi-virtio-can = "9"

LAYERDEPENDS_xaloqi-virtio-can = "core openembedded-layer"
LAYERSERIES_COMPAT_xaloqi-virtio-can = "wrynose"

# Which HAT DomD drives (recipes-guest/domd-vc4/domd-vc4.bbappend):
#   mcp2515    Waveshare 2-CH (isolated) CAN HAT, classic CAN (the default)
#   mcp2518fd  Waveshare 2-CH CAN FD HAT (Rev2.1, "Dual SPI Mode"), CAN FD
# ../sodev-add.sh writes the value from its XAQ_CAN_HAT environment variable.
XAQ_CAN_HAT ?= "mcp2515"
